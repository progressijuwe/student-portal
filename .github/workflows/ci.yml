name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, format & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # --max-warnings=0: a warning nobody fixes is a warning nobody reads.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://example.invalid/api

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Blocking on critical only.
      #
      # The one outstanding high advisory is GHSA-qwww-vcr4-c8h2 in react-router
      # (<8.3.0), a CSRF bypass that only applies to RSC mode. This is a plain
      # client-rendered SPA with no RSC and no server component, so the affected
      # code path does not exist here; the fix requires a major-version upgrade.
      # Revisit when react-router 8 is adopted, then restore --audit-level=high.
      - name: npm audit (blocking)
        run: npm audit --audit-level=critical

      # Informational: surfaces high advisories without failing the build.
      - name: npm audit (report)
        run: npm audit --audit-level=high || true
